name: palco-manu04
services:
  database:
    image: postgres:18-alpine
    container_name: palco-postgres-manu04
    environment:
      POSTGRES_DB: palco_dev_manu04
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no ambiente}
    ports:
      - "5435:5432"
    volumes:
      - palco_manu04_data:/var/lib/postgresql
      - ./database04/palco-database:/opt/palco/database04:ro
      - ./scripts/database04/docker-init.sh:/docker-entrypoint-initdb.d/01-palco.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  palco_manu04_data:
